<!DOCTYPE html>
<html>
<head>
    <title>Voice Library</title>
</head>
<body>
    <h1>Voice Library</h1>
    <input type="text" id="book-input" placeholder="Type a book name">
    <button id="submit-btn">Search</button>
    <button id="voice-btn">Use Voice</button>
    <p id="result"></p>

    <script>
    async function sendRequest(bookName) {
        const response = await fetch("/borrow", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ book: bookName })
        });
        const data = await response.json();
        document.getElementById("result").innerText = data.message;
    }

    document.getElementById("submit-btn").onclick = function() {
        const bookName = document.getElementById("book-input").value;
        sendRequest(bookName);
    }

    document.getElementById("voice-btn").onclick = function() {
        sendRequest("voice");
    }
    </script>
</body>
</html>
