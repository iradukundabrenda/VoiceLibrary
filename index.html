<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Voice Library</h1>
    <input type="text" id="bookTitle" placeholder="Type the book name or use voice input">
    <button onclick="borrowBook()">Borrow</button>
    <button onclick="startVoice()">🎤 Voice Input</button>

    <p id="message"></p>

    <script>
        async function borrowBook(title=null) {
            const input = title || document.getElementById("bookTitle").value;
            if (!input) return;

            const response = await fetch("/borrow", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: input })
            });

            const data = await response.json();
            document.getElementById("message").innerText = data.message;
        }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Voice recognition not supported in this browser");
                return;
            }

            const recognition = new webkitSpeechRecognition();
            recognition.lang = "en-US";
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById("bookTitle").value = transcript;
                borrowBook(transcript);
            };

            recognition.onerror = function(event) {
                console.log("Voice recognition error:", event.error);
            }

            recognition.start();
        }
    </script>
</body>
</html>
